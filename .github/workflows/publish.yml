name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag estable a publicar (por defecto v1.0.3)"
        required: true
        default: "v1.0.3"

permissions:
  contents: write

jobs:
  publish:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Create env file
        shell: bash
        run: |
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" > .env

      - name: Stamp build-info.json
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const info = {
            stableVersion: "1.0.3",
            buildId: Number(process.env.GITHUB_RUN_NUMBER) || Date.now(),
            releasedAt: new Date().toISOString(),
            gitSha: process.env.GITHUB_SHA || null,
          };
          fs.writeFileSync("app/build-info.json", JSON.stringify(info, null, 2) + "\n");
          console.log("Stamped build-info", info);
          NODE

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install macOS DMG license helper
        if: runner.os == 'macOS'
        run: npm install dmg-license --no-save

      - name: Install dependencies
        run: npm ci

      - name: Build core + renderer
        run: |
          npm run build:core
          npm run build:renderer

      - name: Build Electron packages
        uses: heliomarpm/action-electron-builder@2.1
        with:
          # Windows: x64+ia32 in ONE publish so latest.yml sha512 matches the uploaded Setup.
          args: ${{ runner.os == 'Windows' && '-w --x64 --ia32' || '' }}
          max_attempts: 3
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release: true

      - name: Upload build-info.json to release
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          gh release upload "$TAG" app/build-info.json --clobber

  # Keep the GitHub release as draft while matrix jobs upload assets, then publish
  # so auto-update never sees a missing latest.yml (404).
  finalize:
    name: Publish release
    needs: publish
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Undraft release when assets are ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          for i in 1 2 3 4 5 6 8; do
            COUNT=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq '.assets | length')
            HAS_YML=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq '[.assets[].name] | map(select(. == "latest.yml")) | length')
            HAS_INFO=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq '[.assets[].name] | map(select(. == "build-info.json")) | length')
            echo "Assets=${COUNT} latest.yml=${HAS_YML} build-info=${HAS_INFO}"
            if [ "${COUNT}" -ge 10 ] && [ "${HAS_YML}" != "0" ]; then
              break
            fi
            sleep 20
          done
          HAS_YML=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq '[.assets[].name] | map(select(. == "latest.yml")) | length')
          if [ "${HAS_YML}" = "0" ]; then
            echo "latest.yml still missing on ${TAG}"
            exit 1
          fi
          gh release edit "${TAG}" --draft=false --latest
          echo "Release ${TAG} is now public (latest)."
