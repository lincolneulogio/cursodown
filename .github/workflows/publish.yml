name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (debe existir, p. ej. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  publish:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Create env file
        shell: bash
        run: |
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" > .env

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install macOS DMG license helper
        if: runner.os == 'macOS'
        run: npm install dmg-license --no-save

      - name: Install dependencies
        run: npm ci

      - name: Build core + renderer
        run: |
          npm run build:core
          npm run build:renderer

      - name: Build Electron packages
        uses: heliomarpm/action-electron-builder@2.1
        with:
          max_attempts: 3
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release: true

      - name: Build Windows ia32 packages
        if: runner.os == 'Windows'
        uses: heliomarpm/action-electron-builder@2.1
        with:
          args: --ia32
          max_attempts: 3
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release: true
